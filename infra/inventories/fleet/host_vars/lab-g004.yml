---
# GPU node: XL270d Gen10, 8x V100 SXM2 32 GB. Facts from evidence/2026-09-26/fleet-discovery (read-only, 26 Sep).
ansible_host: 10.90.10.14
fleet_role: gpu
chassis_serial: EXSERIAL04
bmc: {name: lab-gpu-bmc, address: 198.18.0.127, type: ilo5, tunnel_port: 18450, user: hpadmin, password_file: ~/.config/prace-lab/g005-ilo-hpadmin.pw}   # fleet credential
os_disk: {kind: scsi_wwn, wwn: 60050000f7fca2d55eb51600d6e1fa5c}   # P408i-a RAID1, 447 GB
nvme_serials: [EXNVME00000041, EXNVME00000042]             # 2x 1.6 TB -> BeeGFS /scratch targets
nvme_euis: [eui.eeee0000000000000000000000000041, eui.eeee0000000000000000000000000042]   # same order; lsblk WWN, node facts 28 Sep (playbooks/beegfs-disk-wipe.yml)
admin_ip: 10.90.10.14
fleet_network_protected: {eno2: 10.90.10.14/25}
fleet_disabled_links:
  - {name: ens10f0np0, mac: '02:00:00:00:00:0c', pci: '0000:88:00.0'}
  - {name: ens10f1np1, mac: '02:00:00:00:00:0d', pci: '0000:88:00.1'}
admin_mac: ''   # not yet known: which port is cabled to the private switch (BMC has no link state)
admin_mac_candidates: ['02:00:00:00:00:0e', '02:00:00:00:00:0f', '02:00:00:00:00:10', '02:00:00:00:00:11']   # 331i ports 1-4 from the BMC (26 Sep); installer picks the one where the login node answers
# InfiniBand: two working 841QSFP28 cards (slots 11, 12); link state unknown until Monday
slurm_node: "CPUs=36 Boards=1 SocketsPerBoard=2 CoresPerSocket=18 ThreadsPerCore=1 RealMemory=768000"   # ASSUMED equal to g005; slurmd -C check verifies on Monday
# InfiniBand ring ports, read 2 Oct (evidence/2026-10-02/ib-port-map): LinkUp/INIT at 100 Gb EDR,
# no subnet manager. Keyed by port GUID and PCI address (mlx5_N names follow enumeration order).
# Which node each port reaches is not yet proved: that read needs infiniband-diags (network.yml).
ib_ring_ports:
  - {guid: 'b883:03ff:ff7f:e188', pci: '0000:14:00.0'}
  - {guid: 'b883:03ff:ff7f:e189', pci: '0000:14:00.1'}
