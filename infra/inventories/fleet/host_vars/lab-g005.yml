---
# GPU node: XL270d Gen10, 8x V100 SXM2 32 GB. Facts from evidence/2026-09-26/fleet-discovery (read-only, 26 Sep).
ansible_host: 10.90.10.15
fleet_role: gpu
chassis_serial: EXSERIAL05
bmc: {name: lab-gpu-bmc, address: 198.18.0.128, type: ilo5, tunnel_port: 18443, user: hpadmin, password_file: ~/.config/prace-lab/g005-ilo-hpadmin.pw}   # fleet credential
os_disk: {kind: scsi_wwn, wwn: 60050000a346210d311ce34853176ea6}   # P408i-a RAID1, 447 GB
nvme_serials: [EXNVME00000051, EXNVME00000052]             # 2x 1.6 TB -> BeeGFS /scratch targets
nvme_euis: [eui.eeee0000000000000000000000000051, eui.eeee0000000000000000000000000052]   # same order; lsblk WWN, node facts 28 Sep (playbooks/beegfs-disk-wipe.yml)
admin_ip: 10.90.10.15
fleet_network_protected: {eno2: 10.90.10.15/25}
fleet_disabled_links:
  - {name: ens10f0np0, mac: '02:00:00:00:00:12', pci: '0000:88:00.0'}
  - {name: ens10f1np1, mac: '02:00:00:00:00:13', pci: '0000:88:00.1'}
admin_mac: 02:00:00:00:00:14   # eno2, today 10.88.0.3
# InfiniBand (26 Sep): slot 12 ports b883:03ff:ff7f:f138/f139 linked, no SM (ring candidates);
# slot 11 port 1 b883:03ff:ff6f:2188 ACTIVE on an outside fabric (recommended: unplug); slot 11 port 2 no cable
slurm_node: "CPUs=36 Boards=1 SocketsPerBoard=2 CoresPerSocket=18 ThreadsPerCore=1 RealMemory=768000"   # measured 27 Sep: 2x18 cores, HT off, 772147 MiB
# InfiniBand ring ports, read 2 Oct (evidence/2026-10-02/ib-port-map): LinkUp/INIT at 100 Gb EDR,
# no subnet manager. Keyed by port GUID and PCI address (mlx5_N names follow enumeration order).
# Which node each port reaches is not yet proved: that read needs infiniband-diags (network.yml).
ib_ring_ports:
  - {guid: 'b883:03ff:ff7f:f138', pci: '0000:14:00.0'}
  - {guid: 'b883:03ff:ff7f:f139', pci: '0000:14:00.1'}
