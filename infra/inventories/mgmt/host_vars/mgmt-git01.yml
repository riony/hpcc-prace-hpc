# Outgoing email (owner decision 2026-09-26): the campus relay refuses external recipients
# (550 5.7.1 from h001), so GitLab sends through Gmail as the owner's account; the owner
# accepted that its app password sits (encrypted) on this VM. The owner stores it with
# gitlab-rake gitlab:smtp:secret:write before email is enabled here.
gitlab_smtp_enable: true
gitlab_email_from: contributor@example.org
gitlab_pipeline_email_recipients:
  hpcc/prace-hackathon: [contributor@example.org]

# Off-node fleet monitor (roles/fleet_monitor). Enabled once the login node authorized its key
# (inventories/fleet group_vars/all/monitoring.yml), 28 Sep.
fleet_monitor_enable: true
