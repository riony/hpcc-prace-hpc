---
# Virtual rehearsal (T68): the login and CPU nodes as local VMs (infra/rehearsal/fleet-vms.sh).
# Facts are the fleet's own (symlinked); connection settings point only at localhost, and
# playbooks/rehearsal.yml refuses to run if any target resolves elsewhere.
fleet:
  children:
    login:
      hosts:
        lab-dl380:
    cpu:
      hosts:
        lab-lenovo:
    gpu:
      hosts: {}

# Both compute kinds (host_base time source, repository client, NFS client, slurmd).
compute:
  children:
    cpu:
    gpu:
