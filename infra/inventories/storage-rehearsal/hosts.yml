---
# Storage rehearsal (D39 storage step): two throwaway VMs on the login node's rehearsal host,
# created and deleted by tools/storage-rehearsal.sh (up/down). sr-login stands in for the login
# node (VG sr_vg on its data disk, like hpe_vg), sr-client for a compute node. Same group shape
# as inventories/fleet; the account and network facts are the fleet's own (symlinked).
# Reached only through the login node's 127.0.0.1 forwards; playbooks/storage-rehearsal-guard.yml
# refuses any other target.
fleet:
  children:
    login:
      hosts:
        sr-login:
    cpu:
      hosts:
        sr-client:
    gpu:
      hosts: {}

# Both compute kinds (host_base time source, repository client, NFS client, slurmd).
compute:
  children:
    cpu:
    gpu:
