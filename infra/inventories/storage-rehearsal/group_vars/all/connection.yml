---
# Storage rehearsal VMs: reached ONLY through the login node, on its 127.0.0.1 ssh forwards
# (host_vars ports). The throwaway key, the VM host keys pinned from each VM's console and the
# ssh config (jump host: the workstation's normal known_hosts, strict, one multiplexed
# connection) live in ~/.cache/prace-storage-rehearsal, written by 'tools/storage-rehearsal.sh up'
# and removed by 'down': with the VMs down, every connection fails. playbooks/
# storage-rehearsal-guard.yml refuses any target that is not one of these forwards.
ansible_connection: ssh            # a variable, so a -c/--connection option cannot override it
ansible_host_key_checking: true    # a variable beats ANSIBLE_HOST_KEY_CHECKING=False in the environment
ansible_user: root
ansible_python_interpreter: /usr/bin/python3
storage_rehearsal: true
storage_rehearsal_dir: "{{ lookup('env', 'HOME') }}/.cache/prace-storage-rehearsal"
ansible_ssh_private_key_file: "{{ storage_rehearsal_dir }}/id"
ansible_ssh_common_args: >-
  -F {{ storage_rehearsal_dir }}/ssh_config
  -o ProxyJump=root@192.0.2.205
  -o StrictHostKeyChecking=yes
  -o UserKnownHostsFile={{ storage_rehearsal_dir }}/known_hosts
  -o HostKeyAlgorithms=ssh-ed25519
  -o IdentitiesOnly=yes
