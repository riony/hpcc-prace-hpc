---
# The management service on the DL380 (beegfs_mgmt_host). Its database is created only by the armed
# first use (-e beegfs_format_confirm=lab-dl380:mgmtd). A missing database is never recreated by
# ordinary convergence: losing it means the coordinated whole-scratch recreation (plan A4).
- name: This run passed its gates and holds the lease (a run started past them changes nothing)
  ansible.builtin.assert:
    that: bg_run_gated | bool
    fail_msg: "{{ inventory_hostname }}: nothing done: the gates of playbooks/beegfs.yml did not pass in this run"
    quiet: true

- name: This is the management host of the data file
  ansible.builtin.assert:
    that: inventory_hostname == beegfs_mgmt_host
    fail_msg: "{{ inventory_hostname }} is not beegfs_mgmt_host ({{ beegfs_mgmt_host }})"
    quiet: true

- name: Shared preparation
  ansible.builtin.include_tasks: common.yml

- name: Pinned management packages (with the licence library and the beegfs CLI)
  ansible.builtin.include_tasks: packages.yml
  vars:
    bg_pkg_names: "{{ beegfs_packages.mgmtd }}"
    bg_pkg_extra: []

- name: TLS key of the management (root, 0400; never logged)
  ansible.builtin.copy:
    src: "{{ beegfs_tls_key_src }}"
    dest: "{{ beegfs_tls_key }}"
    owner: root
    group: root
    mode: "0400"
  register: bg_tls_key
  no_log: true
  when: not beegfs_tls_disable | bool

- name: Management configuration (TOML)
  ansible.builtin.include_tasks: conf-set.yml
  vars:
    bg_conf_path: "{{ beegfs_conf_dir }}/beegfs-mgmtd.toml"
    bg_conf_settings: "{{ bg_mgmtd_settings }}"
    bg_conf_format: toml

- name: Configuration changed
  ansible.builtin.set_fact:
    bg_mgmtd_changed: >-
      {{ bg_conf_changed | bool or bg_auth is changed or bg_net is changed
         or bg_tls_key is changed or bg_cert_file is changed }}

- name: Drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/system/beegfs-mgmtd.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Refuse to start without the database (never an empty replacement)
  ansible.builtin.template:
    src: guard.conf.j2
    dest: /etc/systemd/system/beegfs-mgmtd.service.d/10-prace-guard.conf
    owner: root
    group: root
    mode: "0644"
  vars:
    bg_guard: "{{ bg_guard_mgmtd }}"
  register: bg_mgmtd_dropin

- name: Management database
  ansible.builtin.stat:
    path: "{{ beegfs_mgmtd_db }}"
  register: bg_db

- name: A missing database is created only by the armed first use
  ansible.builtin.assert:
    that: bg_db.stat.exists or ('mgmtd' in bg_confirm_items and bg_first_use_authorised | bool) or ansible_check_mode
    fail_msg: >-
      {{ beegfs_mgmtd_db }} is missing. Its first creation needs -e beegfs_format_armed=true
      -e beegfs_format_confirm={{ inventory_hostname }}:mgmtd inside your lease; after a loss, recreate
      the whole scratch (plan A4) instead.
    quiet: true

- name: Initialise the management database (first use)
  ansible.builtin.command:
    argv: ["{{ beegfs_mgmtd_bin }}", --init]
    creates: "{{ beegfs_mgmtd_db }}"
  when: not bg_db.stat.exists and 'mgmtd' in bg_confirm_items and bg_first_use_authorised | bool and not ansible_check_mode

- name: Management running (restarted after a change)
  ansible.builtin.systemd:
    name: beegfs-mgmtd
    state: "{{ 'restarted' if bg_mgmtd_changed | bool or bg_mgmtd_dropin is changed else 'started' }}"
    enabled: true
    daemon_reload: "{{ bg_mgmtd_dropin is changed }}"
  when: bg_pkgs_present | bool or not ansible_check_mode

- name: Settle
  ansible.builtin.pause:
    seconds: "{{ beegfs_service_settle_s }}"
  when: not ansible_check_mode

- name: Management active
  ansible.builtin.command: systemctl is-active beegfs-mgmtd
  changed_when: false
  check_mode: false
  when: not ansible_check_mode
