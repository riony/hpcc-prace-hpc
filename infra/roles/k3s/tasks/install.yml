---
# Shared by server and agent: k3s_src is a directory of SHA-256-verified artifacts.
- name: k3s-selinux policy (file hash pinned in defaults; Rancher's repository is not configured)
  ansible.builtin.dnf:
    name: "{{ k3s_src }}/{{ k3s_selinux_rpm }}"
    disable_gpg_check: true
    state: present

- name: K3s binary
  ansible.builtin.copy:
    src: "{{ k3s_src }}/k3s"
    dest: /usr/local/bin/k3s
    remote_src: true
    owner: root
    group: root
    mode: "0755"
  notify: restart k3s

- name: Air-gap image directory
  ansible.builtin.file:
    path: /var/lib/rancher/k3s/agent/images
    state: directory
    mode: "0755"

- name: Air-gap images (K3s imports them when it starts; no registry access needed)
  ansible.builtin.copy:
    src: "{{ k3s_src }}/k3s-airgap-images-amd64.tar.zst"
    dest: /var/lib/rancher/k3s/agent/images/k3s-airgap-images-amd64.tar.zst
    remote_src: true
    mode: "0644"
  notify: restart k3s

- name: SELinux labels (policy-defined types for the binary and data directory)
  ansible.builtin.command: restorecon -Rv /usr/local/bin/k3s /var/lib/rancher
  register: k3s_restorecon
  # restorecon also prints 'not reset as customized' for runtime container labels (untouched)
  changed_when: "'Relabeled' in k3s_restorecon.stdout"

- name: Configuration directory
  ansible.builtin.file:
    path: /etc/rancher/k3s
    state: directory
    mode: "0755"

- name: Registries served by the embedded peer mirror (workers fetch from the login node)
  ansible.builtin.copy:
    dest: /etc/rancher/k3s/registries.yaml
    owner: root
    group: root
    mode: "0644"
    content: |
      # Managed by Ansible (roles/k3s): pull these through the cluster's embedded mirror.
      mirrors:
      {% for r in k3s_mirrored_registries %}
        {{ r }}:
      {% endfor %}
  notify: restart k3s

- name: Configuration (the agent's holds the join token)
  ansible.builtin.template:
    src: "config-{{ 'server' if fleet_role == 'login' else 'agent' }}.yaml.j2"
    dest: /etc/rancher/k3s/config.yaml
    owner: root
    group: root
    mode: "0600"
  no_log: "{{ fleet_role != 'login' }}"
  notify: restart k3s

- name: Service unit from the release's own script (no download; policy already installed)
  ansible.builtin.command: sh {{ k3s_src }}/install.sh
  environment:
    INSTALL_K3S_SKIP_DOWNLOAD: "true"
    INSTALL_K3S_SKIP_SELINUX_RPM: "true"
    INSTALL_K3S_EXEC: "{{ 'server' if fleet_role == 'login' else 'agent' }}"
  args:
    creates: "/etc/systemd/system/{{ 'k3s' if fleet_role == 'login' else 'k3s-agent' }}.service"

- name: Service enabled and running
  ansible.builtin.systemd:
    name: "{{ 'k3s' if fleet_role == 'login' else 'k3s-agent' }}"
    enabled: true
    state: started
