---
# Refuse while another operation holds the cluster lease on the login node: the backup's
# maintenance window (tools/k3s-login-backup.sh) or an acceptance run (tools/slinky-acceptance.sh).
# A converge started BY the lease holder passes its id: -e fleet_lease_id=<id>.
- name: Cluster lease on the login node
  ansible.builtin.command: cat {{ fleet_lease_path | default('/run/prace-cluster-lease') }}/holder
  register: fleet_lease
  delegate_to: "{{ fleet_lease_host | default(groups['login'][0]) }}"
  run_once: true
  changed_when: false
  failed_when: false
  check_mode: false
  tags: [always]

- name: No lease held by another operation
  ansible.builtin.assert:
    that: >-
      fleet_lease.rc != 0 or
      (fleet_lease_id | default('') | length > 0 and ('id=' ~ fleet_lease_id ~ ' ') in (fleet_lease.stdout ~ ' '))
    fail_msg: "The cluster is leased ({{ fleet_lease.stdout | default('') }}); wait for that window to close"
    quiet: true
  run_once: true
  tags: [always]
